<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d27"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cbf8a"/>
      <stop offset="100%" stop-color="#3a9066"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="2" y="2" width="1196" height="626" rx="12" fill="none" stroke="#2e3348" stroke-width="2"/>

  <!-- Tree icon (centered, left of text) -->
  <g transform="translate(340, 115) scale(3.5)">
    <!-- Trunk -->
    <rect x="27" y="38" width="10" height="18" rx="2" fill="#d4a853"/>
    <!-- Canopy layers -->
    <ellipse cx="32" cy="28" rx="20" ry="16" fill="url(#canopy)" opacity="0.85"/>
    <ellipse cx="24" cy="24" rx="12" ry="10" fill="#5cbf8a" opacity="0.7"/>
    <ellipse cx="40" cy="24" rx="12" ry="10" fill="#5cbf8a" opacity="0.7"/>
    <ellipse cx="32" cy="20" rx="14" ry="11" fill="#6dd89e" opacity="0.6"/>
    <circle cx="26" cy="18" r="2" fill="#a3f0c0" opacity="0.5"/>
    <circle cx="36" cy="22" r="1.5" fill="#a3f0c0" opacity="0.4"/>
  </g>

  <!-- Title text -->
  <text x="600" y="470" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#e8eaf0" letter-spacing="-1">Rivadeneira</text>
  <text x="600" y="540" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="400" fill="#9ba1b0" letter-spacing="4">FAMILY TREE</text>

  <!-- Decorative line -->
  <line x1="440" y1="490" x2="760" y2="490" stroke="#2e3348" stroke-width="1"/>
</svg>
